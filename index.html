<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Чат с другом · WebSocket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0d1b2a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .chat-card {
            max-width: 600px;
            width: 100%;
            background: #1b2e44;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #3a5a78;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid #2f4a62;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            color: #e3edf5;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #8bb4d0;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.green {
            background: #2ecc71;
            box-shadow: 0 0 8px #2ecc71aa;
        }

        .dot.red {
            background: #e74c3c;
            box-shadow: 0 0 8px #e74c3caa;
        }

        #messages {
            background: #0f1f30;
            border-radius: 20px;
            padding: 16px;
            height: 380px;
            overflow-y: auto;
            margin: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #2a4055;
        }

        #messages::-webkit-scrollbar {
            width: 5px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: #3e5f7a;
            border-radius: 10px;
        }

        .msg {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            animation: fade 0.2s ease;
        }

        .msg.me {
            align-self: flex-end;
            background: #2a6b96;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg.other {
            align-self: flex-start;
            background: #2a4055;
            color: #e8f0f7;
            border-bottom-left-radius: 4px;
        }

        .msg .name {
            font-size: 0.7rem;
            font-weight: 600;
            opacity: 0.7;
            margin-bottom: 3px;
        }

        .msg .time {
            font-size: 0.6rem;
            opacity: 0.4;
            margin-top: 4px;
            text-align: right;
        }

        @keyframes fade {
            from { opacity: 0.3; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            background: #0f1f30;
            border: 1px solid #2f4a62;
            border-radius: 40px;
            padding: 14px 18px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .input-area input::placeholder {
            color: #6a8aa8;
        }

        .input-area input:focus {
            border-color: #3a8bb9;
        }

        .input-area button {
            background: #2a6b96;
            border: none;
            border-radius: 40px;
            padding: 14px 24px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .input-area button:hover {
            background: #3a7fb0;
            transform: scale(0.97);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 0.7rem;
            color: #5a7a96;
        }

        .footer button {
            background: none;
            border: none;
            color: #5a7a96;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .footer button:hover {
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="chat-card">
    <div class="chat-header">
        <h1>💬 Чат</h1>
        <div class="status">
            <span class="dot green" id="statusDot"></span>
            <span id="statusText">Подключение...</span>
        </div>
    </div>

    <div id="messages"></div>

    <div class="input-area">
        <input type="text" id="input" placeholder="Введите сообщение..." />
        <button id="sendBtn">➤</button>
    </div>

    <div class="footer">
        <span id="userLabel">Вы: <strong id="myName">Вы</strong></span>
        <button id="clearBtn">✕ Очистить</button>
    </div>
</div>

<script>
    // ===== НАСТРОЙКИ =====
    // Используем бесплатный WebSocket сервер (echo + broadcast)
    const WS_URL = 'wss://ws.postman-echo.com/raw';

    // Генерируем случайное имя при входе
    const names = ['Алекс', 'Мария', 'Денис', 'Екатерина', 'Илья', 'Анна', 'Максим', 'София', 'Артём', 'Ольга'];
    const myName = names[Math.floor(Math.random() * names.length)];
    document.getElementById('myName').textContent = myName;

    // ===== СОСТОЯНИЕ =====
    let ws = null;
    let isConnected = false;

    const messagesContainer = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const clearBtn = document.getElementById('clearBtn');

    // Храним историю (для очистки)
    let messageHistory = [];

    // ===== ФУНКЦИИ =====

    function setStatus(connected) {
        isConnected = connected;
        if (connected) {
            statusDot.className = 'dot green';
            statusText.textContent = 'Онлайн';
        } else {
            statusDot.className = 'dot red';
            statusText.textContent = 'Офлайн';
        }
    }

    function addMessage(name, text, isMe = false) {
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'me' : 'other'}`;

        const nameSpan = document.createElement('div');
        nameSpan.className = 'name';
        nameSpan.textContent = name;

        const textSpan = document.createElement('div');
        textSpan.textContent = text;

        const timeSpan = document.createElement('div');
        timeSpan.className = 'time';
        timeSpan.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        div.appendChild(nameSpan);
        div.appendChild(textSpan);
        div.appendChild(timeSpan);

        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        // Сохраняем в историю (для очистки)
        messageHistory.push({ name, text, isMe });
    }

    function clearMessages() {
        messagesContainer.innerHTML = '';
        messageHistory = [];
    }

    function sendMessage(text) {
        if (!text.trim()) return;
        if (!isConnected) {
            alert('Нет подключения к серверу. Попробуйте перезагрузить страницу.');
            return;
        }

        const trimmed = text.trim();
        // Отправляем в формате: имя|текст
        const payload = `${myName}|${trimmed}`;
        ws.send(payload);

        // Показываем у себя сразу (оптимистично)
        addMessage(myName, trimmed, true);
        input.value = '';
    }

    // ===== ПОДКЛЮЧЕНИЕ WEBSOCKET =====

    function connect() {
        try {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                setStatus(true);
                // Отправляем системное сообщение о входе (но сервер его просто отразит)
                // Мы его не показываем, чтобы не спамить.
                // Вместо этого покажем приветствие локально
                if (messageHistory.length === 0) {
                    addMessage('Система', 'Чат готов! Отправьте сообщение другу.', false);
                }
            };

            ws.onmessage = (event) => {
                const data = event.data;
                // Ожидаем формат: имя|текст
                const separatorIndex = data.indexOf('|');
                if (separatorIndex === -1) {
                    // Если пришло что-то другое — игнорируем или показываем как системное
                    return;
                }

                const name = data.substring(0, separatorIndex);
                const text = data.substring(separatorIndex + 1);

                // Не показываем свои же сообщения (они уже добавлены оптимистично)
                if (name === myName) return;

                addMessage(name, text, false);
            };

            ws.onclose = () => {
                setStatus(false);
                // Попробуем переподключиться через 3 секунды
                setTimeout(connect, 3000);
            };

            ws.onerror = (err) => {
                console.warn('WebSocket ошибка:', err);
                setStatus(false);
                ws.close();
            };

        } catch (e) {
            console.error('Ошибка подключения:', e);
            setStatus(false);
            setTimeout(connect, 3000);
        }
    }

    // ===== СОБЫТИЯ =====

    sendBtn.addEventListener('click', () => {
        sendMessage(input.value);
    });

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage(input.value);
        }
    });

    clearBtn.addEventListener('click', () => {
        if (confirm('Очистить историю сообщений?')) {
            clearMessages();
            addMessage('Система', 'История очищена.', false);
        }
    });

    // ===== СТАРТ =====

    connect();

    // Фокус на поле ввода
    input.focus();
</script>

</body>
</html>
