<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Чат с другом · Работает!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0d1b2a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .chat-card {
            max-width: 600px;
            width: 100%;
            background: #1b2e44;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #3a5a78;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid #2f4a62;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            color: #e3edf5;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #8bb4d0;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.green {
            background: #2ecc71;
            box-shadow: 0 0 8px #2ecc71aa;
            animation: pulse 1.5s infinite;
        }

        .dot.red {
            background: #e74c3c;
            box-shadow: 0 0 8px #e74c3caa;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        #messages {
            background: #0f1f30;
            border-radius: 20px;
            padding: 16px;
            height: 400px;
            overflow-y: auto;
            margin: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid #2a4055;
        }

        #messages::-webkit-scrollbar {
            width: 5px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: #3e5f7a;
            border-radius: 10px;
        }

        .msg {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            animation: fade 0.2s ease;
        }

        .msg.me {
            align-self: flex-end;
            background: #2a6b96;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg.other {
            align-self: flex-start;
            background: #2a4055;
            color: #e8f0f7;
            border-bottom-left-radius: 4px;
        }

        .msg .name {
            font-size: 0.7rem;
            font-weight: 600;
            opacity: 0.8;
            margin-bottom: 3px;
        }

        .msg .text {
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .msg .time {
            font-size: 0.55rem;
            opacity: 0.4;
            margin-top: 4px;
            text-align: right;
        }

        @keyframes fade {
            from { opacity: 0.3; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            background: #0f1f30;
            border: 1px solid #2f4a62;
            border-radius: 40px;
            padding: 14px 18px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        .input-area input::placeholder {
            color: #6a8aa8;
        }

        .input-area input:focus {
            border-color: #3a8bb9;
            box-shadow: 0 0 0 3px rgba(58, 139, 185, 0.2);
        }

        .input-area button {
            background: #2a6b96;
            border: none;
            border-radius: 40px;
            padding: 14px 24px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            font-size: 1rem;
        }

        .input-area button:hover {
            background: #3a7fb0;
            transform: scale(0.97);
        }

        .input-area button:active {
            transform: scale(0.94);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 0.7rem;
            color: #5a7a96;
        }

        .footer button {
            background: none;
            border: none;
            color: #5a7a96;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
            padding: 4px 8px;
            border-radius: 12px;
        }

        .footer button:hover {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
        }

        .room-info {
            font-size: 0.65rem;
            color: #4a6a86;
            text-align: center;
            margin-top: 8px;
            padding: 4px;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
        }

        .room-info code {
            background: #0d1b2a;
            padding: 2px 10px;
            border-radius: 12px;
            color: #7ab7e0;
        }
    </style>
</head>
<body>

<div class="chat-card">
    <div class="chat-header">
        <h1>💬 Чат</h1>
        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Подключение...</span>
        </div>
    </div>

    <div id="messages"></div>

    <div class="input-area">
        <input type="text" id="input" placeholder="Напишите сообщение..." autocomplete="off" />
        <button id="sendBtn">➤ Отпр.</button>
    </div>

    <div class="footer">
        <span>Вы: <strong id="myName">Загрузка...</strong></span>
        <button id="clearBtn">✕ Очистить</button>
    </div>
    <div class="room-info">
        🟢 Комната: <code id="roomId">загрузка...</code>
    </div>
</div>

<script>
    // ============================================================
    //  ИСПОЛЬЗУЕМ БЕСПЛАТНЫЙ WEBSOCKET С BROADCAST (рассылка всем)
    //  Сервер: wss://ws.a0x.xyz (поддерживает broadcast)
    // ============================================================

    // Генерируем уникальную комнату (чтобы не пересекаться с другими)
    // Можно поменять на что-то своё, например, "myroom2026"
    const ROOM = 'chat_' + Math.random().toString(36).substring(2, 8);
    document.getElementById('roomId').textContent = ROOM;

    // Имена
    const names = ['Алекс', 'Мария', 'Денис', 'Екатерина', 'Илья', 'Анна', 'Максим', 'София', 'Артём', 'Ольга', 'Дима', 'Лена'];
    const myName = names[Math.floor(Math.random() * names.length)];
    document.getElementById('myName').textContent = myName;

    // ===== DOM =====
    const messagesContainer = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const clearBtn = document.getElementById('clearBtn');

    let ws = null;
    let isConnected = false;
    let reconnectAttempts = 0;

    // ===== ФУНКЦИИ =====

    function setStatus(connected) {
        isConnected = connected;
        if (connected) {
            statusDot.className = 'dot green';
            statusText.textContent = 'Онлайн';
        } else {
            statusDot.className = 'dot red';
            statusText.textContent = 'Офлайн';
        }
    }

    function addMessage(name, text, isMe = false) {
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'me' : 'other'}`;

        const nameSpan = document.createElement('div');
        nameSpan.className = 'name';
        nameSpan.textContent = name;

        const textSpan = document.createElement('div');
        textSpan.className = 'text';
        textSpan.textContent = text;

        const timeSpan = document.createElement('div');
        timeSpan.className = 'time';
        timeSpan.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        div.appendChild(nameSpan);
        div.appendChild(textSpan);
        div.appendChild(timeSpan);

        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function clearMessages() {
        messagesContainer.innerHTML = '';
    }

    function sendMessage(text) {
        if (!text.trim()) return;
        if (!isConnected) {
            alert('❌ Нет подключения к серверу. Подождите...');
            return;
        }

        const trimmed = text.trim();
        // Формат: КОМНАТА|ИМЯ|ТЕКСТ
        const payload = `${ROOM}|${myName}|${trimmed}`;
        ws.send(payload);

        // Показываем у себя (оптимистично)
        addMessage(myName, trimmed, true);
        input.value = '';
        input.focus();
    }

    // ===== ПОДКЛЮЧЕНИЕ WEBSOCKET =====

    function connect() {
        try {
            // Используем сервер с поддержкой broadcast
            ws = new WebSocket('wss://ws.a0x.xyz');

            ws.onopen = () => {
                setStatus(true);
                reconnectAttempts = 0;

                // Отправляем системное сообщение о входе в комнату
                const joinMsg = `${ROOM}|🔵 Система|👋 ${myName} присоединился к чату`;
                ws.send(joinMsg);

                // Приветствие локально
                if (messagesContainer.children.length === 0) {
                    addMessage('💡 Система', 'Чат работает! Отправьте сообщение другу.', false);
                    addMessage('💡 Система', `Комната: ${ROOM}`, false);
                }
            };

            ws.onmessage = (event) => {
                const data = event.data;
                // Формат: КОМНАТА|ИМЯ|ТЕКСТ
                const parts = data.split('|');
                if (parts.length < 3) return;

                const room = parts[0];
                const name = parts[1];
                const text = parts.slice(2).join('|'); // на случай если в тексте есть |

                // Игнорируем сообщения из других комнат
                if (room !== ROOM) return;

                // Игнорируем свои сообщения (уже показаны оптимистично)
                if (name === myName) return;

                addMessage(name, text, false);
            };

            ws.onclose = () => {
                setStatus(false);
                // Переподключение с экспоненциальной задержкой
                const delay = Math.min(5000, 1000 * Math.pow(1.5, reconnectAttempts));
                reconnectAttempts++;
                setTimeout(connect, delay);
            };

            ws.onerror = (err) => {
                console.warn('WebSocket ошибка:', err);
                setStatus(false);
                ws.close();
            };

        } catch (e) {
            console.error('Ошибка подключения:', e);
            setStatus(false);
            setTimeout(connect, 3000);
        }
    }

    // ===== СОБЫТИЯ =====

    sendBtn.addEventListener('click', () => sendMessage(input.value));

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage(input.value);
        }
    });

    clearBtn.addEventListener('click', () => {
        if (confirm('Очистить историю сообщений локально?')) {
            clearMessages();
            addMessage('💡 Система', 'История очищена.', false);
        }
    });

    // ===== СТАРТ =====

    connect();
    input.focus();

    // Если через 5 секунд нет подключения — покажем подсказку
    setTimeout(() => {
        if (!isConnected && messagesContainer.children.length < 3) {
            addMessage('⚠️ Система', 'Подключение к серверу... Если долго нет связи, обновите страницу.', false);
        }
    }, 5000);
</script>

</body>
</html>
