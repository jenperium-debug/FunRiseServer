<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Побег из дома · Хоррор</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }
        .game-wrapper {
            background: #1d1616;
            padding: 20px 20px 25px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 2px #4a2e2e inset;
        }
        canvas {
            display: block;
            margin: 0 auto;
            width: 800px;
            height: 600px;
            border-radius: 20px;
            box-shadow: 0 0 0 3px #2f1e1e, 0 10px 30px #000000aa;
            background: #191212;
            cursor: crosshair;
        }
        .ui-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 10px 0 10px;
            color: #b7a09a;
            text-shadow: 0 0 8px #4f2626;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        .ui-panel span {
            background: #251d1d;
            padding: 8px 22px;
            border-radius: 60px;
            border: 1px solid #674a4a;
            box-shadow: 0 0 12px #3f1f1f;
        }
        .restart-btn {
            background: #2f1b1b;
            border: none;
            color: #e6d3cb;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 8px 24px;
            border-radius: 60px;
            border: 1px solid #975a5a;
            box-shadow: 0 0 12px #6f2e2e;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            letter-spacing: 1px;
        }
        .restart-btn:hover {
            background: #4f2b2b;
            border-color: #c97a7a;
            color: #fff0e6;
            box-shadow: 0 0 20px #a33f3f;
            transform: scale(0.97);
        }
        .death-message {
            color: #d99b8b;
            font-size: 1.4rem;
            text-shadow: 0 0 20px #b13b3b;
            background: #1d1111;
            padding: 6px 20px;
            border-radius: 60px;
            border: 1px solid #a55353;
        }
        @media (max-width: 840px) {
            canvas { width: 100%; height: auto; aspect-ratio: 4/3; }
            .game-wrapper { padding: 10px; }
            .ui-panel { flex-wrap: wrap; gap: 10px; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="ui-panel">
        <span id="statusDisplay">🔦 Ищи выход</span>
        <span id="healthDisplay">❤️ 3</span>
        <button class="restart-btn" id="restartButton">⟳ Заново</button>
    </div>
</div>
<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ------ Игровые константы ------
        const PLAYER_RADIUS = 16;
        const ENEMY_RADIUS = 22;
        const EXIT_RADIUS = 26;
        const SPEED = 2.8;
        const ENEMY_SPEED = 1.1;

        // ------ Состояние игры ------
        let player = { x: 120, y: 120 };
        let enemies = [];
        let exit = { x: 710, y: 520 };  // выход в правом нижнем углу
        let health = 3;
        let gameActive = true;
        let win = false;

        // ------ Элементы UI ------
        const statusDisplay = document.getElementById('statusDisplay');
        const healthDisplay = document.getElementById('healthDisplay');

        // ------ Клавиши ------
        const keys = {
            w: false, a: false, s: false, d: false
        };

        // ------ Враги (стартовые позиции) ------
        function resetEnemies() {
            enemies = [
                { x: 380, y: 150 },
                { x: 500, y: 400 },
                { x: 200, y: 480 },
                { x: 600, y: 200 }
            ];
        }

        // ------ Полный сброс игры ------
        function resetGame() {
            player.x = 120;
            player.y = 120;
            health = 3;
            win = false;
            gameActive = true;
            resetEnemies();
            // выход всегда на месте
            exit.x = 710;
            exit.y = 520;
            updateUI();
        }

        // ------ Обновление UI ------
        function updateUI() {
            healthDisplay.textContent = `❤️ ${health}`;
            if (!gameActive) {
                if (win) {
                    statusDisplay.innerHTML = '🏆 ВЫБРАЛСЯ! 🏆';
                } else {
                    statusDisplay.innerHTML = '💀 ТЫ УМЕР... 💀';
                }
            } else {
                statusDisplay.innerHTML = '🔦 Ищи выход';
            }
        }

        // ------ Проверка столкновения игрока с врагом ------
        function checkEnemyCollision() {
            for (let e of enemies) {
                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.hypot(dx, dy);
                if (dist < PLAYER_RADIUS + ENEMY_RADIUS) {
                    return true;
                }
            }
            return false;
        }

        // ------ Проверка выхода (победа) ------
        function checkExitReached() {
            const dx = player.x - exit.x;
            const dy = player.y - exit.y;
            return Math.hypot(dx, dy) < PLAYER_RADIUS + EXIT_RADIUS;
        }

        // ------ Обновление игры (движение, логика) ------
        function update() {
            if (!gameActive) return;

            // 1. Движение игрока
            let moveX = 0, moveY = 0;
            if (keys.w) moveY -= 1;
            if (keys.s) moveY += 1;
            if (keys.a) moveX -= 1;
            if (keys.d) moveX += 1;
            if (moveX !== 0 || moveY !== 0) {
                const len = Math.hypot(moveX, moveY);
                moveX = (moveX / len) * SPEED;
                moveY = (moveY / len) * SPEED;
                // Потолок / пол / стены (с учётом радиуса)
                const newX = Math.min(780 - PLAYER_RADIUS, Math.max(PLAYER_RADIUS, player.x + moveX));
                const newY = Math.min(580 - PLAYER_RADIUS, Math.max(PLAYER_RADIUS, player.y + moveY));
                player.x = newX;
                player.y = newY;
            }

            // 2. Проверка столкновения с врагами (урон)
            if (checkEnemyCollision()) {
                health -= 1;
                if (health <= 0) {
                    health = 0;
                    gameActive = false;
                    win = false;
                    updateUI();
                    return; // стоп, игра окончена
                }
                // Отбрасываем игрока назад (чтобы не было бесконечного урона)
                // Отодвинуть от ближайшего врага
                let closest = null;
                let closestDist = Infinity;
                for (let e of enemies) {
                    const d = Math.hypot(player.x - e.x, player.y - e.y);
                    if (d < closestDist) {
                        closestDist = d;
                        closest = e;
                    }
                }
                if (closest) {
                    const angle = Math.atan2(player.y - closest.y, player.x - closest.x);
                    const pushX = Math.cos(angle) * 35;
                    const pushY = Math.sin(angle) * 35;
                    player.x = Math.min(780 - PLAYER_RADIUS, Math.max(PLAYER_RADIUS, player.x + pushX));
                    player.y = Math.min(580 - PLAYER_RADIUS, Math.max(PLAYER_RADIUS, player.y + pushY));
                }
                updateUI();
                // после отбрасывания ещё раз проверим, не попали ли снова на врага (но даём иммунитет на кадр)
                // дополнительная защита: если здоровье >0, но коллизия всё ещё есть — отодвигаем ещё
                if (gameActive && checkEnemyCollision()) {
                    // повторный отскок
                    for (let e of enemies) {
                        const dx = player.x - e.x;
                        const dy = player.y - e.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < PLAYER_RADIUS + ENEMY_RADIUS && dist > 0.001) {
                            const overlap = (PLAYER_RADIUS + ENEMY_RADIUS - dist) * 0.8;
                            const angle = Math.atan2(dy, dx);
                            player.x += Math.cos(angle) * overlap;
                            player.y += Math.sin(angle) * overlap;
                            // границы
                            player.x = Math.min(780 - PLAYER_RADIUS, Math.max(PLAYER_RADIUS, player.x));
                            player.y = Math.min(580 - PLAYER_RADIUS, Math.max(PLAYER_RADIUS, player.y));
                        }
                    }
                }
            }

            // 3. Проверка победы (выход)
            if (checkExitReached()) {
                gameActive = false;
                win = true;
                updateUI();
                return;
            }

            // 4. Движение врагов (к игроку, но с шумом)
            for (let e of enemies) {
                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 1) {
                    const step = Math.min(ENEMY_SPEED, dist);
                    // небольшой случайный джиттер, чтобы не шли точно в ногу
                    const jitterX = (Math.random() - 0.5) * 0.9;
                    const jitterY = (Math.random() - 0.5) * 0.9;
                    const normX = dx / dist + jitterX * 0.15;
                    const normY = dy / dist + jitterY * 0.15;
                    const lenNorm = Math.hypot(normX, normY);
                    if (lenNorm > 0.01) {
                        const moveX = (normX / lenNorm) * step;
                        const moveY = (normY / lenNorm) * step;
                        e.x = Math.min(780 - ENEMY_RADIUS, Math.max(ENEMY_RADIUS, e.x + moveX));
                        e.y = Math.min(580 - ENEMY_RADIUS, Math.max(ENEMY_RADIUS, e.y + moveY));
                    }
                }
            }

            // (Небольшая проверка после движения врагов: если игрок на враге — урон)
            if (gameActive && checkEnemyCollision()) {
                health -= 1;
                if (health <= 0) {
                    health = 0;
                    gameActive = false;
                    win = false;
                    updateUI();
                    return;
                }
                // оттолкнуть
                for (let e of enemies) {
                    const dx = player.x - e.x;
                    const dy = player.y - e.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < PLAYER_RADIUS + ENEMY_RADIUS && dist > 0.001) {
                        const overlap = (PLAYER_RADIUS + ENEMY_RADIUS - dist) * 0.9;
                        const angle = Math.atan2(dy, dx);
                        player.x += Math.cos(angle) * overlap;
                        player.y += Math.sin(angle) * overlap;
                        player.x = Math.min(780 - PLAYER_RADIUS, Math.max(PLAYER_RADIUS, player.x));
                        player.y = Math.min(580 - PLAYER_RADIUS, Math.max(PLAYER_RADIUS, player.y));
                    }
                }
                updateUI();
            }

            // Если здоровье упало до 0 (повторная проверка)
            if (health <= 0 && gameActive) {
                health = 0;
                gameActive = false;
                win = false;
                updateUI();
            }
        }

        // ------ Отрисовка ------
        function draw() {
            ctx.clearRect(0, 0, 800, 600);

            // --- Пол / текстура (жуткий дом) ---
            const grad = ctx.createRadialGradient(300, 200, 50, 400, 300, 500);
            grad.addColorStop(0, '#322121');
            grad.addColorStop(1, '#120c0c');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 800, 600);

            // линии пола (эффект половиц)
            ctx.strokeStyle = '#3b2828';
            ctx.lineWidth = 2.5;
            for (let i = 0; i < 20; i++) {
                const y = 30 + i * 30;
                ctx.beginPath();
                ctx.moveTo(0, y + Math.sin(i * 0.9) * 8);
                ctx.lineTo(800, y + Math.cos(i * 0.7) * 8 + 4);
                ctx.strokeStyle = `rgba(70, 45, 45, ${0.2 + i * 0.015})`;
                ctx.stroke();
            }

            // --- Выход (дверь) ---
            ctx.shadowColor = '#b56f3a';
            ctx.shadowBlur = 35;
            ctx.beginPath();
            ctx.arc(exit.x, exit.y, EXIT_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#b97c4a';
            ctx.fill();
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#e6b17e';
            ctx.font = 'bold 26px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🚪', exit.x, exit.y - 2);
            ctx.shadowBlur = 0;

            // --- Враги (монстры) ---
            for (let e of enemies) {
                // тень
                ctx.shadowColor = '#b33a3a';
                ctx.shadowBlur = 40;
                // тело
                ctx.beginPath();
                ctx.arc(e.x, e.y, ENEMY_RADIUS, 0, Math.PI * 2);
                const grd = ctx.createRadialGradient(e.x-8, e.y-8, 6, e.x, e.y, ENEMY_RADIUS+4);
                grd.addColorStop(0, '#691f1f');
                grd.addColorStop(0.7, '#2d0d0d');
                ctx.fillStyle = grd;
                ctx.fill();
                // глаза
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#f0d8b0';
                ctx.beginPath();
                ctx.arc(e.x-10, e.y-7, 7, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(e.x+10, e.y-7, 7, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#1f0808';
                ctx.beginPath();
                ctx.arc(e.x-12, e.y-5, 3.5, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(e.x+8, e.y-5, 3.5, 0, Math.PI*2);
                ctx.fill();
                // зрачки (красные)
                ctx.fillStyle = '#d64444';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(e.x-14, e.y-9, 1.8, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(e.x+6, e.y-9, 1.8, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // --- Игрок (фонарик) ---
            ctx.shadowColor = '#bd8a4b';
            ctx.shadowBlur = 40;
            ctx.beginPath();
            ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
            const pGrad = ctx.createRadialGradient(player.x-6, player.y-6, 5, player.x, player.y, PLAYER_RADIUS+6);
            pGrad.addColorStop(0, '#dab88b');
            pGrad.addColorStop(0.8, '#7a4d2a');
            ctx.fillStyle = pGrad;
            ctx.fill();
            // глаза игрока (белые)
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#f0eee6';
            ctx.beginPath();
            ctx.arc(player.x-7, player.y-4, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x+7, player.y-4, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#1f1a14';
            ctx.beginPath();
            ctx.arc(player.x-9, player.y-2, 2.5, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x+5, player.y-2, 2.5, 0, Math.PI*2);
            ctx.fill();
            // свет фонарика (конус)
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255, 200, 100, 0.08)';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.arc(player.x, player.y, 140, -0.9, 0.9);
            ctx.fill();

            // --- Детали: кровь на полу (декор) ---
            ctx.shadowBlur = 0;
            for (let i=0; i<6; i++) {
                ctx.fillStyle = `rgba(110, 20, 20, ${0.05 + i*0.02})`;
                ctx.beginPath();
                ctx.arc(70 + i*130, 500 + Math.sin(i)*18, 12 + i*5, 0, Math.PI*2);
                ctx.fill();
            }

            // Если игра окончена — затемнение и текст
            if (!gameActive) {
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, 800, 600);
                ctx.font = 'bold 52px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 30;
                if (win) {
                    ctx.fillStyle = '#d9c89e';
                    ctx.shadowColor = '#e8b86a';
                    ctx.fillText('🔓 ВЫБРАЛСЯ', 400, 260);
                    ctx.font = '24px monospace';
                    ctx.fillStyle = '#c7b29b';
                    ctx.fillText('Свобода...', 400, 350);
                } else {
                    ctx.fillStyle = '#d3a08a';
                    ctx.shadowColor = '#bd3f3f';
                    ctx.fillText('💀 ПОГИБ 💀', 400, 260);
                    ctx.font = '24px monospace';
                    ctx.fillStyle = '#b28070';
                    ctx.fillText('Тьма поглотила тебя...', 400, 350);
                }
                ctx.shadowBlur = 0;
            }
        }

        // ------ Игровой цикл ------
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ------ Обработка клавиш ------
        function keyDownHandler(e) {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                e.preventDefault();
                keys[key] = true;
            }
            // стрелки тоже (для удобства)
            if (e.key === 'ArrowUp') { e.preventDefault(); keys.w = true; }
            if (e.key === 'ArrowDown') { e.preventDefault(); keys.s = true; }
            if (e.key === 'ArrowLeft') { e.preventDefault(); keys.a = true; }
            if (e.key === 'ArrowRight') { e.preventDefault(); keys.d = true; }
        }
        function keyUpHandler(e) {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                e.preventDefault();
                keys[key] = false;
            }
            if (e.key === 'ArrowUp') { e.preventDefault(); keys.w = false; }
            if (e.key === 'ArrowDown') { e.preventDefault(); keys.s = false; }
            if (e.key === 'ArrowLeft') { e.preventDefault(); keys.a = false; }
            if (e.key === 'ArrowRight') { e.preventDefault(); keys.d = false; }
        }
        window.addEventListener('keydown', keyDownHandler);
        window.addEventListener('keyup', keyUpHandler);

        // ------ Кнопка рестарта ------
        document.getElementById('restartButton').addEventListener('click', () => {
            resetGame();
            updateUI();
        });

        // ------ Инициализация ------
        resetGame();
        updateUI();
        gameLoop();

        // защита от скролла при стрелках
        window.addEventListener('keydown', (e) => {
            if (e.key.startsWith('Arrow')) e.preventDefault();
        }, { passive: false });
    })();
</script>
</body>
</html>
