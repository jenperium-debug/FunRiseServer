<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            width: 420px;
            max-width: 100%;
            height: 750px;
            max-height: 100vh;
            background: #1a1a1a;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 80px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }
        
        /* Шапка */
        .header {
            padding: 20px 24px;
            background: #222;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
        }
        
        .header .user-info {
            color: #888;
            font-size: 13px;
        }
        
        .btn-logout {
            background: #c0392b;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }
        
        .btn-logout:hover {
            background: #e74c3c;
        }
        
        /* Окно сообщений */
        .messages {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #111;
        }
        
        .messages .empty {
            color: #555;
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
        }
        
        .msg {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            word-wrap: break-word;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }
        
        .msg.me {
            align-self: flex-end;
            background: #0a84ff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        
        .msg.friend {
            align-self: flex-start;
            background: #2c2c2c;
            color: #eee;
            border-bottom-left-radius: 4px;
        }
        
        .msg .time {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 4px;
            display: block;
        }
        
        .msg .sender {
            font-size: 11px;
            font-weight: 600;
            color: #0a84ff;
            display: block;
            margin-bottom: 2px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Панель ввода */
        .input-area {
            padding: 12px 16px 16px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 10px;
            align-items: end;
        }
        
        .input-area textarea {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            font-size: 14px;
            resize: none;
            outline: none;
            max-height: 80px;
            min-height: 44px;
            transition: 0.3s;
        }
        
        .input-area textarea:focus {
            border-color: #0a84ff;
        }
        
        .input-area textarea::placeholder {
            color: #555;
        }
        
        .btn-send {
            background: #0a84ff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            height: 44px;
            white-space: nowrap;
        }
        
        .btn-send:hover {
            background: #0066cc;
        }
        
        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        /* Формы входа/регистрации */
        .auth-form {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 30px;
            gap: 16px;
        }
        
        .auth-form h2 {
            color: #fff;
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .auth-form input {
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        
        .auth-form input:focus {
            border-color: #0a84ff;
        }
        
        .auth-form input::placeholder {
            color: #555;
        }
        
        .auth-form .btn-auth {
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #0a84ff;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }
        
        .auth-form .btn-auth:hover {
            background: #0066cc;
        }
        
        .auth-form .switch {
            color: #888;
            text-align: center;
            font-size: 14px;
        }
        
        .auth-form .switch a {
            color: #0a84ff;
            cursor: pointer;
            text-decoration: none;
        }
        
        .auth-form .switch a:hover {
            text-decoration: underline;
        }
        
        .auth-form .error {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
        }
        
        .hidden {
            display: none !important;
        }
        
        .call-buttons {
            display: flex;
            gap: 8px;
        }
        
        .btn-call {
            background: #27ae60;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }
        
        .btn-call:hover {
            background: #2ecc71;
        }
        
        .btn-call.end {
            background: #c0392b;
        }
        
        .btn-call.end:hover {
            background: #e74c3c;
        }
        
        .status {
            color: #888;
            font-size: 12px;
            text-align: center;
            padding: 4px;
        }
        
        /* Скролл */
        .messages::-webkit-scrollbar {
            width: 4px;
        }
        .messages::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- Шапка -->
    <div class="header" id="header" style="display:none;">
        <div>
            <h1>💬 Мессенджер</h1>
            <div class="user-info" id="userDisplay">Пользователь</div>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
            <button class="btn-call" id="callBtn" onclick="makeCall()">📞 Позвонить</button>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </div>
    
    <!-- Сообщения -->
    <div class="messages" id="messages">
        <div class="empty">Авторизуйтесь, чтобы начать общение</div>
    </div>
    
    <!-- Статус звонка -->
    <div class="status" id="callStatus"></div>
    
    <!-- Ввод -->
    <div class="input-area" id="inputArea" style="display:none;">
        <textarea id="msgInput" rows="1" placeholder="Введите сообщение..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
        <button class="btn-send" id="sendBtn" onclick="sendMessage()">Отправить</button>
    </div>
    
    <!-- Форма авторизации -->
    <div class="auth-form" id="authForm">
        <h2 id="authTitle">Вход</h2>
        <input type="text" id="authUsername" placeholder="Имя пользователя" autocomplete="username">
        <input type="password" id="authPassword" placeholder="Пароль" autocomplete="current-password">
        <div class="error" id="authError"></div>
        <button class="btn-auth" id="authBtn" onclick="auth()">Войти</button>
        <div class="switch">
            <span id="switchText">Нет аккаунта?</span>
            <a id="switchLink" onclick="toggleAuth()">Зарегистрироваться</a>
        </div>
    </div>
</div>

<script>
// ============ КОНФИГУРАЦИЯ ============
// ⚠️ ИЗМЕНИТЕ ЭТУ ССЫЛКУ НА ВАШ ХОСТИНГ!
const API_URL = window.location.origin + '/api.php';

// ============ СОСТОЯНИЕ ============
let currentUser = null;
let isLogin = true;
let pollInterval = null;
let callActive = false;
let peerConnection = null;
let localStream = null;

// ============ АВТОРИЗАЦИЯ ============
function toggleAuth() {
    isLogin = !isLogin;
    document.getElementById('authTitle').textContent = isLogin ? 'Вход' : 'Регистрация';
    document.getElementById('authBtn').textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
    document.getElementById('switchText').textContent = isLogin ? 'Нет аккаунта?' : 'Уже есть аккаунт?';
    document.getElementById('switchLink').textContent = isLogin ? 'Зарегистрироваться' : 'Войти';
    document.getElementById('authError').textContent = '';
}

async function auth() {
    const username = document.getElementById('authUsername').value.trim();
    const password = document.getElementById('authPassword').value.trim();
    const errorEl = document.getElementById('authError');
    
    if (!username || !password) {
        errorEl.textContent = 'Заполните все поля';
        return;
    }
    
    const action = isLogin ? 'login' : 'register';
    
    try {
        const resp = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action, username, password })
        });
        
        const data = await resp.json();
        
        if (data.success) {
            currentUser = username;
            document.getElementById('authForm').classList.add('hidden');
            document.getElementById('header').style.display = 'flex';
            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('userDisplay').textContent = '👤 ' + username;
            document.getElementById('messages').innerHTML = '<div class="empty">Добро пожаловать! Начинайте общение.</div>';
            
            // Загружаем историю
            loadMessages();
            // Запускаем опрос
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(loadMessages, 2000);
        } else {
            errorEl.textContent = data.error || 'Ошибка';
        }
    } catch (e) {
        errorEl.textContent = 'Ошибка соединения с сервером';
        console.error(e);
    }
}

function logout() {
    currentUser = null;
    if (pollInterval) clearInterval(pollInterval);
    if (peerConnection) peerConnection.close();
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    callActive = false;
    document.getElementById('callStatus').textContent = '';
    document.getElementById('authForm').classList.remove('hidden');
    document.getElementById('header').style.display = 'none';
    document.getElementById('inputArea').style.display = 'none';
    document.getElementById('messages').innerHTML = '<div class="empty">Авторизуйтесь, чтобы начать общение</div>';
    document.getElementById('authPassword').value = '';
    document.getElementById('authError').textContent = '';
}

// ============ СООБЩЕНИЯ ============
async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !currentUser) return;
    
    input.value = '';
    input.style.height = 'auto';
    
    try {
        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'send',
                username: currentUser,
                message: text
            })
        });
        loadMessages();
    } catch (e) {
        console.error('Ошибка отправки:', e);
    }
}

async function loadMessages() {
    if (!currentUser) return;
    
    try {
        const resp = await fetch(API_URL + '?action=get&user=' + encodeURIComponent(currentUser));
        const data = await resp.json();
        
        if (data.success && data.messages) {
            const container = document.getElementById('messages');
            container.innerHTML = '';
            
            if (data.messages.length === 0) {
                container.innerHTML = '<div class="empty">Нет сообщений. Напишите что-нибудь!</div>';
                return;
            }
            
            data.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'msg ' + (msg.username === currentUser ? 'me' : 'friend');
                
                if (msg.username !== currentUser) {
                    const sender = document.createElement('span');
                    sender.className = 'sender';
                    sender.textContent = msg.username;
                    div.appendChild(sender);
                }
                
                const text = document.createElement('span');
                text.textContent = msg.message;
                div.appendChild(text);
                
                const time = document.createElement('span');
                time.className = 'time';
                time.textContent = new Date(msg.created_at).toLocaleTimeString();
                div.appendChild(time);
                
                container.appendChild(div);
            });
            
            container.scrollTop = container.scrollHeight;
        }
    } catch (e) {
        console.error('Ошибка загрузки:', e);
    }
}

// ============ ЗВОНКИ (WebRTC) ============
async function makeCall() {
    if (!currentUser) return;
    
    if (callActive) {
        // Завершить звонок
        if (peerConnection) peerConnection.close();
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        callActive = false;
        document.getElementById('callStatus').textContent = 'Звонок завершён';
        document.getElementById('callBtn').textContent = '📞 Позвонить';
        document.getElementById('callBtn').className = 'btn-call';
        return;
    }
    
    try {
        // Запрашиваем доступ к микрофону
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        
        // Создаём PeerConnection
        const config = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' }
            ]
        };
        peerConnection = new RTCPeerConnection(config);
        
        // Добавляем аудио-трек
        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });
        
        // Создаём оффер
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        
        // Отправляем оффер на сервер
        const resp = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'call',
                username: currentUser,
                offer: JSON.stringify(peerConnection.localDescription)
            })
        });
        
        const data = await resp.json();
        if (data.success) {
            callActive = true;
            document.getElementById('callStatus').textContent = '📞 Идёт вызов... Ожидайте ответа';
            document.getElementById('callBtn').textContent = '🔴 Завершить';
            document.getElementById('callBtn').className = 'btn-call end';
            
            // Ждём ответа
            waitForAnswer();
        }
    } catch (e) {
        console.error('Ошибка звонка:', e);
        alert('Не удалось начать звонок. Проверьте микрофон.');
    }
}

async function waitForAnswer() {
    // Проверяем каждые 2 секунды, не пришёл ли ответ
    const checkInterval = setInterval(async () => {
        if (!callActive) {
            clearInterval(checkInterval);
            return;
        }
        
        try {
            const resp = await fetch(API_URL + '?action=check_call&user=' + encodeURIComponent(currentUser));
            const data = await resp.json();
            
            if (data.success && data.answer) {
                clearInterval(checkInterval);
                const answer = JSON.parse(data.answer);
                await peerConnection.setRemoteDescription(answer);
                document.getElementById('callStatus').textContent = '📞 Соединение установлено!';
            }
        } catch (e) {
            console.error('Ошибка проверки ответа:', e);
        }
    }, 2000);
}

// ============ АВТО-РАЗМЕР ТЕКСТАРИИ ============
document.getElementById('msgInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 80) + 'px';
});

// ============ ЗАПУСК ============
console.log('📱 Мессенджер запущен');
console.log('ℹ️ API URL:', API_URL);
console.log('⚠️ Убедитесь, что файл api.php загружен на хостинг!');
</script>
</body>
</html>
