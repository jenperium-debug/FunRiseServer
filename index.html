<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Побег от Грэнни · 2 этажа</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0505; font-family: 'Courier New', monospace; }
        #ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #health {
            position: absolute;
            bottom: 30px; left: 30px;
            color: #e0b0a0;
            font-size: 2rem;
            background: #140b0bcc;
            padding: 6px 28px;
            border-radius: 60px;
            border: 1px solid #884444;
            box-shadow: 0 0 30px #441111;
            backdrop-filter: blur(3px);
            letter-spacing: 2px;
            user-select: none;
        }
        #status {
            position: absolute;
            bottom: 30px; right: 30px;
            color: #dbb8a8;
            font-size: 1.3rem;
            background: #0f0808dd;
            padding: 8px 28px;
            border-radius: 60px;
            border: 1px solid #7a4a4a;
            backdrop-filter: blur(3px);
            text-align: center;
            min-width: 140px;
            user-select: none;
        }
        #info {
            position: absolute;
            top: 20px; left: 20px;
            color: #d9b8a8;
            background: rgba(10, 5, 5, 0.75);
            padding: 10px 20px;
            border-radius: 30px;
            border-left: 3px solid #a54444;
            pointer-events: none;
            text-shadow: 0 0 12px #3f1a1a;
            user-select: none;
            backdrop-filter: blur(2px);
            font-size: 0.9rem;
        }
        #controls-hint {
            position: absolute;
            bottom: 100px; left: 50%;
            transform: translateX(-50%);
            color: #a77a6a;
            background: #1a0e0ed4;
            padding: 8px 24px;
            border-radius: 60px;
            font-size: 0.9rem;
            border: 1px solid #5f3a3a;
            backdrop-filter: blur(4px);
            letter-spacing: 1px;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
        }
        #restartBtn {
            position: absolute;
            top: 20px; right: 20px;
            background: #2d1717;
            border: 1px solid #a55353;
            color: #f0d6c6;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 8px 24px;
            border-radius: 60px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 20px #631f1f;
            transition: 0.15s;
            z-index: 20;
            letter-spacing: 1px;
            backdrop-filter: blur(3px);
            background: #1a0d0dd4;
            pointer-events: auto;
        }
        #restartBtn:hover {
            background: #4d2626;
            border-color: #d67a7a;
            transform: scale(0.96);
            box-shadow: 0 0 30px #aa3f3f;
        }
        #floor-indicator {
            position: absolute;
            top: 80px; left: 50%;
            transform: translateX(-50%);
            color: #dbb8a8;
            background: #140b0bcc;
            padding: 4px 24px;
            border-radius: 30px;
            border: 1px solid #7a4a4a;
            font-size: 1.2rem;
            backdrop-filter: blur(3px);
            user-select: none;
            pointer-events: none;
            letter-spacing: 2px;
        }
        @media (max-width: 700px) {
            #health { font-size: 1.3rem; padding: 4px 16px; bottom: 15px; left: 15px; }
            #status { font-size: 1.0rem; padding: 4px 16px; min-width: 100px; bottom: 15px; right: 15px; }
            #controls-hint { font-size: 0.7rem; padding: 4px 12px; bottom: 70px; white-space: normal; }
            #floor-indicator { font-size: 0.9rem; top: 70px; padding: 2px 16px; }
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="info">🏚️ Побег от Грэнни · 2 этажа</div>
        <div id="health">❤️ 3</div>
        <div id="status">🔦 Ищи выход</div>
        <div id="floor-indicator">📍 1 этаж</div>
        <div id="controls-hint">WASD — ходьба · Мышь — взгляд · E — взаимодействие</div>
        <button id="restartBtn">⟳ Заново</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- Сцена ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0707);
        scene.fog = new THREE.FogExp2(0x0b0707, 0.006);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(0, 1.7, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        // --- Управление ---
        const controls = new PointerLockControls(camera, renderer.domElement);
        let isLocked = false;

        // --- Освещение ---
        const ambient = new THREE.AmbientLight(0x332222, 0.5);
        scene.add(ambient);

        const mainLight = new THREE.DirectionalLight(0xffcc88, 0.6);
        mainLight.position.set(5, 8, 3);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.PointLight(0x885533, 0.3, 20);
        fillLight.position.set(-3, 3, -4);
        scene.add(fillLight);

        // Фонарик
        const flashlight = new THREE.SpotLight(0xffd09a, 2.0, 16, Math.PI / 5, 0.5, 1.5);
        flashlight.position.set(0, 1.6, 0);
        flashlight.target.position.set(0, 0, -5);
        scene.add(flashlight);
        scene.add(flashlight.target);

        // --- Построение двухэтажного дома ---
        function createWall(w, h, pos, rotY = 0, color = 0x3d2424) {
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.95, metalness: 0.0, emissive: 0x0d0808, emissiveIntensity: 0.05 });
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.3), mat);
            wall.position.set(pos.x, pos.y, pos.z);
            wall.rotation.y = rotY;
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            return wall;
        }

        // Пол 1 этажа
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a1a1a, roughness: 0.9, metalness: 0.1, emissive: 0x0f0808, emissiveIntensity: 0.05 });
        const floor1 = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), floorMat);
        floor1.rotation.x = -Math.PI / 2;
        floor1.position.y = 0;
        floor1.receiveShadow = true;
        scene.add(floor1);

        // Пол 2 этажа
        const floor2Mat = new THREE.MeshStandardMaterial({ color: 0x2a1a1a, roughness: 0.9, metalness: 0.1, emissive: 0x0f0808, emissiveIntensity: 0.05 });
        const floor2 = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), floor2Mat);
        floor2.rotation.x = -Math.PI / 2;
        floor2.position.y = 3.5;
        floor2.receiveShadow = true;
        scene.add(floor2);

        // Стены 1 этажа (с проёмами)
        // Задняя стена
        createWall(16, 3.5, { x: 0, y: 1.75, z: -8 }, 0);
        // Левая стена
        createWall(16, 3.5, { x: -8, y: 1.75, z: 0 }, Math.PI/2);
        // Правая стена
        createWall(16, 3.5, { x: 8, y: 1.75, z: 0 }, Math.PI/2);
        // Передняя стена (с проёмом для выхода)
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x3d2424, roughness: 0.95, emissive: 0x0d0808, emissiveIntensity: 0.05 });
        const wallFrontL = new THREE.Mesh(new THREE.BoxGeometry(6, 3.5, 0.3), wallMat);
        wallFrontL.position.set(-3.5, 1.75, 8);
        wallFrontL.castShadow = true;
        wallFrontL.receiveShadow = true;
        scene.add(wallFrontL);

        const wallFrontR = new THREE.Mesh(new THREE.BoxGeometry(6, 3.5, 0.3), wallMat);
        wallFrontR.position.set(3.5, 1.75, 8);
        wallFrontR.castShadow = true;
        wallFrontR.receiveShadow = true;
        scene.add(wallFrontR);

        const wallFrontTop = new THREE.Mesh(new THREE.BoxGeometry(4, 0.8, 0.3), wallMat);
        wallFrontTop.position.set(0, 3.3, 8);
        wallFrontTop.castShadow = true;
        wallFrontTop.receiveShadow = true;
        scene.add(wallFrontTop);

        // Стены 2 этажа (с проёмами для лестницы)
        // Задняя стена
        createWall(16, 3.5, { x: 0, y: 5.25, z: -8 }, 0);
        // Левая стена
        createWall(16, 3.5, { x: -8, y: 5.25, z: 0 }, Math.PI/2);
        // Правая стена
        createWall(16, 3.5, { x: 8, y: 5.25, z: 0 }, Math.PI/2);
        // Передняя стена
        createWall(16, 3.5, { x: 0, y: 5.25, z: 8 }, 0);

        // --- Лестница между этажами ---
        function createStair(x, z, yBase) {
            const stairMat = new THREE.MeshStandardMaterial({ color: 0x4a2a2a, roughness: 0.8 });
            for (let i = 0; i < 10; i++) {
                const step = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.15, 0.5), stairMat);
                step.position.set(x + i * 0.45, yBase + i * 0.35, z);
                step.castShadow = true;
                step.receiveShadow = true;
                scene.add(step);
            }
        }
        createStair(-1.0, -2.5, 0.1);
        createStair(-1.0, 2.5, 0.1);

        // --- Дверь выхода (1 этаж) ---
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x7a4f2a, emissive: 0xac6f3a, emissiveIntensity: 0.2, roughness: 0.4 });
        const door = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.8, 0.3), doorMat);
        door.position.set(0, 1.4, 8.15);
        door.castShadow = true;
        scene.add(door);

        // Ручка
        const handleMat = new THREE.MeshStandardMaterial({ color: 0xc99f5e, emissive: 0x553322, emissiveIntensity: 0.2 });
        const handle = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), handleMat);
        handle.position.set(0.9, 1.4, 8.4);
        scene.add(handle);

        // Свет над дверью
        const exitLight = new THREE.PointLight(0xffaa55, 0.8, 10);
        exitLight.position.set(0, 3.0, 8.0);
        scene.add(exitLight);

        // --- Грэнни (преследователь) ---
        const grannyGroup = new THREE.Group();
        // Тело
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a2a2a, roughness: 0.9, emissive: 0x1a0a0a, emissiveIntensity: 0.1 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.6), bodyMat);
        body.position.y = 0.7;
        body.castShadow = true;
        grannyGroup.add(body);

        // Голова
        const headMat = new THREE.MeshStandardMaterial({ color: 0xd4a88a, roughness: 0.8 });
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), headMat);
        head.position.y = 1.6;
        head.castShadow = true;
        grannyGroup.add(head);

        // Глаза (злые)
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff4422, emissive: 0xaa2222, emissiveIntensity: 0.5 });
        const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat);
        eye1.position.set(-0.12, 1.7, 0.25);
        grannyGroup.add(eye1);
        const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat);
        eye2.position.set(0.12, 1.7, 0.25);
        grannyGroup.add(eye2);

        // Платье
        const dressMat = new THREE.MeshStandardMaterial({ color: 0x2a1a1a, roughness: 0.9 });
        const dress = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 0.5, 8), dressMat);
        dress.position.y = 0.25;
        dress.castShadow = true;
        grannyGroup.add(dress);

        grannyGroup.position.set(-4, 0, -3);
        scene.add(grannyGroup);

        // Свет вокруг Грэнни
        const grannyLight = new THREE.PointLight(0x883333, 0.4, 5);
        grannyLight.position.set(-4, 1.5, -3);
        scene.add(grannyLight);

        // --- Мебель (препятствия) ---
        function createFurniture(w, h, d, x, z, color = 0x3a2525) {
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.9, emissive: 0x0d0808 });
            const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            box.position.set(x, h/2, z);
            box.castShadow = true;
            box.receiveShadow = true;
            scene.add(box);
            return box;
        }

        // 1 этаж
        createFurniture(1.6, 1.2, 0.8, -3, -4, 0x4a2a2a);
        createFurniture(1.2, 0.8, 1.2, 3, -5, 0x3d2222);
        createFurniture(1.8, 1.0, 0.8, -4, 4, 0x4f2e2e);
        createFurniture(1.0, 1.4, 1.0, 4, 3, 0x332020);

        // 2 этаж
        createFurniture(1.6, 1.2, 0.8, -3, -4, 0x4a2a2a);
        createFurniture(1.2, 0.8, 1.2, 3, -5, 0x3d2222);
        createFurniture(1.8, 1.0, 0.8, -4, 4, 0x4f2e2e);
        createFurniture(1.0, 1.4, 1.0, 4, 3, 0x332020);
        // Поднимаем мебель на 2 этаж
        const furniture2 = [
            { w: 1.6, h: 1.2, d: 0.8, x: -3, z: -4, c: 0x4a2a2a },
            { w: 1.2, h: 0.8, d: 1.2, x: 3, z: -5, c: 0x3d2222 },
            { w: 1.8, h: 1.0, d: 0.8, x: -4, z: 4, c: 0x4f2e2e },
            { w: 1.0, h: 1.4, d: 1.0, x: 4, z: 3, c: 0x332020 }
        ];
        furniture2.forEach(f => {
            const mat = new THREE.MeshStandardMaterial({ color: f.c, roughness: 0.9, emissive: 0x0d0808 });
            const box = new THREE.Mesh(new THREE.BoxGeometry(f.w, f.h, f.d), mat);
            box.position.set(f.x, f.h/2 + 3.5, f.z);
            box.castShadow = true;
            box.receiveShadow = true;
            scene.add(box);
        });

        // --- Игровое состояние ---
        const player = {
            health: 3,
            alive: true,
            win: false,
            floor: 1,
            atDoor: false
        };

        // --- UI ---
        const healthDiv = document.getElementById('health');
        const statusDiv = document.getElementById('status');
        const floorDiv = document.getElementById('floor-indicator');

        function updateUI() {
            healthDiv.textContent = `❤️ ${player.health}`;
            floorDiv.textContent = player.floor === 1 ? '📍 1 этаж' : '📍 2 этаж';
            if (!player.alive) {
                statusDiv.innerHTML = player.win ? '🏆 ПОБЕДА!' : '💀 ПОГИБЛА...';
                statusDiv.style.color = player.win ? '#d9c89e' : '#d68a7a';
            } else {
                statusDiv.innerHTML = '🔦 Ищи выход';
                statusDiv.style.color = '#dbb8a8';
            }
        }

        // --- Движение Грэнни (преследование) ---
        let grannyTimer = 0;
        let grannyState = 'idle';
        let grannyTargetX = -4;
        let grannyTargetZ = -3;

        function updateGranny() {
            if (!player.alive) return;

            const dx = camera.position.x - grannyGroup.position.x;
            const dz = camera.position.z - grannyGroup.position.z;
            const dist = Math.sqrt(dx*dx + dz*dz);

            // Если игрок близко - преследовать
            if (dist < 10 && player.alive) {
                // Двигаемся к игроку
                const speed = 0.03;
                const angle = Math.atan2(dz, dx);
                const newX = grannyGroup.position.x + Math.cos(angle) * speed;
                const newZ = grannyGroup.position.z + Math.sin(angle) * speed;

                // Ограничение в пределах дома
                const bound = 7.5;
                const floorY = player.floor === 1 ? 0 : 3.5;
                grannyGroup.position.x = Math.min(bound, Math.max(-bound, newX));
                grannyGroup.position.z = Math.min(bound, Math.max(-bound, newZ));
                grannyGroup.position.y = floorY;

                // Обновляем свет
                grannyLight.position.copy(grannyGroup.position);
                grannyLight.position.y += 1.5;

                // Поворот к игроку
                const lookAngle = Math.atan2(dz, dx);
                grannyGroup.rotation.y = lookAngle;

                // Проверка столкновения с игроком
                if (dist < 1.2 && player.alive) {
                    player.health -= 1;
                    if (player.health <= 0) {
                        player.health = 0;
                        player.alive = false;
                        player.win = false;
                        controls.unlock();
                        updateUI();
                        return;
                    }
                    // Отбрасываем игрока
                    const pushAngle = Math.atan2(dz, dx);
                    camera.position.x += Math.cos(pushAngle) * 1.5;
                    camera.position.z += Math.sin(pushAngle) * 1.5;
                    updateUI();
                }
            }
        }

        // --- Перемещение между этажами ---
        function checkFloorTransition() {
            if (!player.alive) return;
            const px = camera.position.x;
            const pz = camera.position.z;

            // Лестница на 2 этаж (x: -1, z: -2.5)
            if (Math.abs(px + 1) < 1.5 && Math.abs(pz + 2.5) < 1.5) {
                if (player.floor === 1) {
                    camera.position.y = 5.2;
                    player.floor = 2;
                    updateUI();
                }
            }
            // Лестница на 1 этаж (x: -1, z: 2.5)
            if (Math.abs(px + 1) < 1.5 && Math.abs(pz - 2.5) < 1.5) {
                if (player.floor === 2) {
                    camera.position.y = 1.7;
                    player.floor = 1;
                    updateUI();
                }
            }
        }

        // --- Проверка выхода ---
        function checkExit() {
            if (!player.alive) return;
            const px = camera.position.x;
            const pz = camera.position.z;
            if (player.floor === 1 && pz > 7.0 && Math.abs(px) < 1.5) {
                player.alive = false;
                player.win = true;
                controls.unlock();
                updateUI();
            }
        }

        // --- Обновление фонарика ---
        function updateFlashlight() {
            flashlight.position.copy(camera.position);
            flashlight.position.y = player.floor === 1 ? 1.4 : 5.0;
            const target = new THREE.Vector3(0, 0, -5);
            target.applyQuaternion(camera.quaternion);
            target.add(camera.position);
            flashlight.target.position.copy(target);
        }

        // --- Сброс ---
        function resetGame() {
            camera.position.set(0, 1.7, 4);
            controls.lock();
            player.health = 3;
            player.alive = true;
            player.win = false;
            player.floor = 1;
            grannyGroup.position.set(-4, 0, -3);
            grannyLight.position.set(-4, 1.5, -3);
            updateUI();
        }

        // --- Клавиши ---
        const keys = { w: false, a: false, s: false, d: false };

        document.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'a' || k === 's' || k === 'd') {
                keys[k] = true;
                e.preventDefault();
            }
            if (e.key === ' ' && !player.alive) {
                e.preventDefault();
                resetGame();
            }
        });
        document.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'a' || k === 's' || k === 'd') {
                keys[k] = false;
                e.preventDefault();
            }
        });

        // --- Клик для блокировки ---
        renderer.domElement.addEventListener('click', () => {
            if (!isLocked && player.alive) controls.lock();
        });

        controls.addEventListener('lock', () => { isLocked = true; });
        controls.addEventListener('unlock', () => { isLocked = false; });

        // --- Кнопка рестарта ---
        document.getElementById('restartBtn').addEventListener('click', resetGame);

        // --- Анимация ---
        function animate() {
            requestAnimationFrame(animate);

            // Движение игрока
            if (isLocked && player.alive) {
                const speed = 0.08;
                const forward = new THREE.Vector3(0, 0, -1);
                forward.applyQuaternion(camera.quaternion);
                forward.y = 0;
                forward.normalize();
                const right = new THREE.Vector3(1, 0, 0);
                right.applyQuaternion(camera.quaternion);
                right.y = 0;
                right.normalize();

                let moveX = 0, moveZ = 0;
                if (keys.w) { moveX += forward.x; moveZ += forward.z; }
                if (keys.s) { moveX -= forward.x; moveZ -= forward.z; }
                if (keys.a) { moveX -= right.x; moveZ -= right.z; }
                if (keys.d) { moveX += right.x; moveZ += right.z; }

                if (moveX !== 0 || moveZ !== 0) {
                    const len = Math.sqrt(moveX*moveX + moveZ*moveZ);
                    moveX = (moveX / len) * speed;
                    moveZ = (moveZ / len) * speed;
                    const bound = 7.5;
                    let newX = camera.position.x + moveX;
                    let newZ = camera.position.z + moveZ;
                    newX = Math.min(bound, Math.max(-bound, newX));
                    newZ = Math.min(bound, Math.max(-bound, newZ));
                    camera.position.x = newX;
                    camera.position.z = newZ;
                }

                checkFloorTransition();
                checkExit();
                updateGranny();
                updateFlashlight();
                updateUI();
            }

            // Анимация Грэнни (покачивание)
            if (player.alive) {
                grannyGroup.position.y += Math.sin(Date.now() * 0.003) * 0.001;
            }

            renderer.render(scene, camera);
        }

        // --- Ресайз ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Старт ---
        resetGame();
        animate();

        console.log('👵 Побег от Грэнни! Найдите выход на 1 этаже.');
        console.log('🪜 Лестницы на x=-1, z=-2.5 (вверх) и x=-1, z=2.5 (вниз)');
    </script>
</body>
</html>
