<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кликер · NFT прокачка</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0d10;
      padding: 16px;
      position: relative;
      isolation: isolate;
    }

    /* анимированный фон с неоновыми акцентами */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: 
        radial-gradient(circle at 20% 50%, rgba(88, 130, 193, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(193, 88, 150, 0.10) 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(88, 193, 170, 0.08) 0%, transparent 40%),
        #0b0d10;
      animation: bgPulse 12s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: 
        radial-gradient(circle at 30% 40%, rgba(255, 215, 140, 0.04) 0%, transparent 35%),
        radial-gradient(circle at 70% 70%, rgba(180, 210, 240, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 50% 20%, rgba(200, 180, 250, 0.03) 0%, transparent 45%);
      animation: floatOrbs 25s infinite alternate ease-in-out;
    }

    @keyframes floatOrbs {
      0% { transform: scale(1) rotate(0deg); opacity: 0.5; }
      100% { transform: scale(1.3) rotate(12deg); opacity: 1; }
    }

    .card {
      width: 100%;
      max-width: 580px;
      background: rgba(14, 18, 24, 0.78);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-radius: 56px;
      padding: 34px 30px 40px;
      box-shadow: 
        0 40px 80px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.02);
      color: #eaeef2;
      text-align: center;
      transition: all 0.3s ease;
    }

    .title {
      font-weight: 300;
      font-size: 1.8rem;
      letter-spacing: 0.1em;
      color: #c8d6e6;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      text-transform: uppercase;
    }
    .title span {
      background: rgba(255, 255, 255, 0.03);
      padding: 2px 16px 4px;
      border-radius: 100px;
      font-weight: 200;
      font-size: 1rem;
      color: #8aa3bf;
      border: 1px solid rgba(255, 255, 255, 0.04);
      letter-spacing: 0.2em;
    }

    /* клик-зона */
    .tap-area {
      position: relative;
      margin: 16px 0 14px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tap-area:active { transform: scale(0.92); }

    .dog-silhouette {
      width: 150px;
      height: 150px;
      margin: 0 auto;
      background: radial-gradient(circle at 30% 30%, #f0f4fa, #c8d4e4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      font-weight: 200;
      color: #1a222c;
      box-shadow: 
        0 16px 40px rgba(0, 0, 0, 0.6),
        inset 0 -4px 0 rgba(0,0,0,0.08),
        0 0 60px rgba(180, 200, 230, 0.06);
      transition: box-shadow 0.3s, transform 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.06);
      will-change: transform;
      font-family: 'Times New Roman', serif;
      position: relative;
    }
    .dog-silhouette::before {
      content: "ᐠ•ᴥ•ᐟ";
      font-size: 3.4rem;
      font-weight: 400;
      letter-spacing: 2px;
      opacity: 0.9;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tap-area:active .dog-silhouette::before { transform: scale(0.88); }
    .dog-silhouette.bounce {
      animation: bounceDog 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes bounceDog {
      0% { transform: scale(1) rotate(0deg); }
      30% { transform: scale(1.22) rotate(-5deg); }
      60% { transform: scale(0.90) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .dog-silhouette::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      padding: 2px;
      background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.03), transparent, rgba(255,255,255,0.05), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .float-text {
      position: absolute;
      pointer-events: none;
      font-weight: 400;
      font-size: 2.2rem;
      color: #eaf0f8;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 0 40px rgba(160, 200, 255, 0.12);
      animation: floatUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      z-index: 20;
      letter-spacing: -0.02em;
      padding: 0 8px;
      background: transparent;
      backdrop-filter: blur(2px);
    }
    @keyframes floatUp {
      0% { opacity: 0.9; transform: translateY(0) scale(0.7); }
      100% { opacity: 0; transform: translateY(-120px) scale(1.15); }
    }

    /* статистика */
    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      padding: 12px 18px;
      border-radius: 80px;
      margin: 14px 0 18px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      flex-wrap: wrap;
      gap: 6px;
    }
    .stats .label { 
      font-weight: 300; 
      font-size: 0.9rem; 
      color: #8fa8c4; 
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .stats .score {
      background: rgba(0, 0, 0, 0.35);
      padding: 4px 20px;
      border-radius: 60px;
      font-size: 1.8rem;
      font-weight: 300;
      color: #e8f0fa;
      border: 1px solid rgba(255, 255, 255, 0.04);
      min-width: 60px;
      font-variant-numeric: tabular-nums;
    }
    .stats .coins {
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.15);
      padding: 4px 18px;
      border-radius: 60px;
      font-size: 1.5rem;
      font-weight: 300;
      color: #f5e070;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.03);
    }

    /* прогресс-бар с glow */
    .progress-track {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 40px;
      height: 4px;
      margin: 0 0 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7a9bcb, #b0cce8, #8db4e0);
      border-radius: 40px;
      box-shadow: 0 0 20px rgba(120, 180, 240, 0.15);
      transition: width 0.15s ease-out;
    }

    /* улучшения */
    .upgrades-section {
      margin: 16px 0 14px;
      text-align: left;
    }
    .upgrades-section h3 {
      font-weight: 300;
      font-size: 0.8rem;
      letter-spacing: 0.8px;
      color: #7a94b3;
      margin-bottom: 12px;
      text-transform: uppercase;
      opacity: 0.6;
    }
    .upgrade-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px 16px 10px 20px;
      border-radius: 60px;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.02);
      transition: all 0.25s ease;
      backdrop-filter: blur(4px);
    }
    .upgrade-row:hover { 
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.05);
    }
    .upgrade-info { display: flex; flex-direction: column; align-items: flex-start; }
    .upgrade-name { 
      font-weight: 400; 
      font-size: 0.95rem; 
      color: #d4e0ee; 
      letter-spacing: 0.2px;
    }
    .upgrade-desc { 
      font-size: 0.7rem; 
      color: #7a94b3; 
      letter-spacing: 0.2px;
      margin-top: 1px;
    }
    .upgrade-price {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.85rem;
      color: #f5e070;
      background: rgba(0,0,0,0.2);
      padding: 3px 14px 3px 12px;
      border-radius: 40px;
      border: 1px solid rgba(212, 175, 55, 0.08);
      font-weight: 300;
    }
    .upgrade-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #d4e0ee;
      padding: 6px 20px;
      border-radius: 40px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 300;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-left: 10px;
      backdrop-filter: blur(4px);
    }
    .upgrade-btn:hover { background: rgba(255, 255, 255, 0.08); }
    .upgrade-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.12); }
    .upgrade-btn:disabled {
      opacity: 0.25;
      pointer-events: none;
      filter: grayscale(0.5);
    }

    /* NFT секция */
    .nft-section {
      margin: 16px 0 12px;
      text-align: left;
    }
    .nft-section h3 {
      font-weight: 300;
      font-size: 0.8rem;
      letter-spacing: 0.8px;
      color: #7a94b3;
      margin-bottom: 12px;
      text-transform: uppercase;
      opacity: 0.6;
    }
    .nft-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    .nft-card {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 24px;
      padding: 16px 8px 14px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.02);
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
      position: relative;
      overflow: hidden;
    }
    .nft-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.02), transparent 70%);
      pointer-events: none;
    }
    .nft-card.owned {
      border-color: rgba(212, 175, 55, 0.2);
      background: rgba(212, 175, 55, 0.04);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.02);
    }
    .nft-card.owned::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 24px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(212,175,55,0.15), transparent, rgba(212,175,55,0.05));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .nft-icon {
      font-size: 2.4rem;
      line-height: 1.2;
      filter: grayscale(0.1);
      transition: transform 0.3s;
    }
    .nft-card:hover .nft-icon { transform: scale(1.05); }
    .nft-name {
      font-size: 0.8rem;
      font-weight: 300;
      color: #c8d4e2;
      margin: 6px 0 2px;
      letter-spacing: 0.3px;
    }
    .nft-bonus {
      font-size: 0.7rem;
      color: #8aa3bf;
      opacity: 0.7;
      font-weight: 300;
    }
    .nft-price {
      font-size: 0.8rem;
      color: #f5e070;
      margin: 6px 0 4px;
      background: rgba(0,0,0,0.2);
      padding: 2px 14px;
      border-radius: 30px;
      display: inline-block;
      font-weight: 300;
      border: 1px solid rgba(212, 175, 55, 0.06);
    }
    .nft-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #d4e0ee;
      padding: 4px 16px;
      border-radius: 30px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 4px;
      font-weight: 300;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }
    .nft-btn:hover { background: rgba(255, 255, 255, 0.06); }
    .nft-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.10); }
    .nft-btn:disabled {
      opacity: 0.25;
      pointer-events: none;
      filter: grayscale(0.5);
    }
    .nft-card .owned-badge {
      font-size: 0.6rem;
      color: #f5e070;
      background: rgba(212, 175, 55, 0.08);
      padding: 2px 14px;
      border-radius: 30px;
      display: inline-block;
      margin-top: 4px;
      border: 1px solid rgba(212, 175, 55, 0.08);
      font-weight: 300;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .footer-note {
      margin-top: 24px;
      color: #4d6680;
      font-weight: 200;
      font-size: 0.75rem;
      letter-spacing: 0.6px;
      opacity: 0.3;
      border-top: 1px solid rgba(255, 255, 255, 0.02);
      padding-top: 18px;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .card { padding: 20px 16px 28px; border-radius: 36px; }
      .dog-silhouette { width: 110px; height: 110px; }
      .dog-silhouette::before { font-size: 2.4rem; }
      .title { font-size: 1.4rem; }
      .stats .score { font-size: 1.3rem; padding: 2px 12px; }
      .stats .coins { font-size: 1.2rem; padding: 2px 12px; }
      .nft-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
      .upgrade-row { flex-wrap: wrap; gap: 6px; }
      .upgrade-btn { margin-left: 0; }
      .float-text { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="title">
    кликер <span>·</span>
  </div>

  <div class="tap-area" id="tapArea">
    <div class="dog-silhouette" id="dogSilhouette"></div>
  </div>

  <div class="stats">
    <span class="label">очки</span>
    <span class="score" id="scoreDisplay">0</span>
    <span class="label">🪙</span>
    <span class="coins" id="coinsDisplay">0</span>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
  </div>

  <!-- Улучшения -->
  <div class="upgrades-section">
    <h3>⚡ улучшения</h3>
    <div id="upgradesContainer"></div>
  </div>

  <!-- NFT -->
  <div class="nft-section">
    <h3>🖼️ NFT · коллекция</h3>
    <div class="nft-grid" id="nftGrid"></div>
  </div>

  <div class="footer-note">клик · собирай · прокачивай</div>
</div>

<script>
  (function() {
    'use strict';

    // --- состояние ---
    let state = {
      score: 0,
      coins: 0,
      clickPower: 1,
      passiveIncome: 0,
      upgrades: {
        click: { level: 0, baseCost: 10, costMultiplier: 1.5, bonusPerLevel: 1, maxLevel: 10, name: 'мощность клика', desc: '+1 к силе' },
        coin: { level: 0, baseCost: 15, costMultiplier: 1.6, bonusPerLevel: 1, maxLevel: 8, name: 'монетный бонус', desc: '+1 монета за клик' },
      },
      nfts: [
        { id: 'nft1', name: 'кибер-пёс', bonus: 2, cost: 30, icon: '🔮', owned: false },
        { id: 'nft2', name: 'лунный волк', bonus: 4, cost: 60, icon: '🌙', owned: false },
        { id: 'nft3', name: 'золотой дракон', bonus: 8, cost: 120, icon: '🐉', owned: false },
        { id: 'nft4', name: 'космический лис', bonus: 15, cost: 250, icon: '🚀', owned: false },
      ]
    };

    // --- DOM ---
    const tapArea = document.getElementById('tapArea');
    const dog = document.getElementById('dogSilhouette');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const coinsDisplay = document.getElementById('coinsDisplay');
    const progressFill = document.getElementById('progressFill');
    const upgradesContainer = document.getElementById('upgradesContainer');
    const nftGrid = document.getElementById('nftGrid');

    // --- helper: обновить UI ---
    function updateUI() {
      scoreDisplay.textContent = state.score;
      coinsDisplay.textContent = state.coins;
      let progress = Math.min(state.score, 50);
      let percent = (progress / 50) * 100;
      progressFill.style.width = percent + '%';
      if (state.score > 50) progressFill.style.width = '100%';
    }

    // --- helper: пересчитать бонусы от NFT ---
    function getNFTBonus() {
      let bonus = 0;
      state.nfts.forEach(n => { if (n.owned) bonus += n.bonus; });
      return bonus;
    }

    // --- helper: получить общую силу клика ---
    function getClickPower() {
      const upgradeBonus = state.upgrades.click.level * state.upgrades.click.bonusPerLevel;
      const nftBonus = getNFTBonus();
      return 1 + upgradeBonus + nftBonus;
    }

    // --- helper: получить монеты за клик ---
    function getCoinPerClick() {
      const coinBonus = state.upgrades.coin.level * state.upgrades.coin.bonusPerLevel;
      return 1 + coinBonus;
    }

    // --- обработка клика ---
    function handleTap(event) {
      const power = getClickPower();
      const coinsEarn = getCoinPerClick();

      state.score += power;
      state.coins += coinsEarn;

      updateUI();
      bounceDog();

      let clientX, clientY;
      if (event && event.clientX !== undefined && event.clientY !== undefined) {
        clientX = event.clientX;
        clientY = event.clientY;
      } else if (event && event.touches && event.touches.length > 0) {
        clientX = event.touches[0].clientX;
        clientY = event.touches[0].clientY;
      } else {
        const rect = tapArea.getBoundingClientRect();
        clientX = rect.left + rect.width / 2;
        clientY = rect.top + rect.height / 2;
      }
      spawnFloat(clientX, clientY, `+${power}  +${coinsEarn}🪙`);

      if (navigator.vibrate) navigator.vibrate(6);
      if (event && event.cancelable) event.preventDefault();

      renderUpgrades();
      renderNFTs();
    }

    // --- анимации ---
    function bounceDog() {
      dog.classList.remove('bounce');
      void dog.offsetWidth;
      dog.classList.add('bounce');
      setTimeout(() => dog.classList.remove('bounce'), 450);
    }

    function spawnFloat(x, y, text) {
      const el = document.createElement('div');
      el.className = 'float-text';
      el.textContent = text;
      const rect = tapArea.getBoundingClientRect();
      let left = 50, top = 30;
      if (x !== undefined && y !== undefined) {
        const relX = ((x - rect.left) / rect.width) * 100;
        const relY = ((y - rect.top) / rect.height) * 100;
        left = Math.min(85, Math.max(15, relX));
        top = Math.min(70, Math.max(10, relY));
      }
      el.style.left = left + '%';
      el.style.top = top + '%';
      el.style.transform = 'translate(-50%, -50%)';
      tapArea.appendChild(el);
      setTimeout(() => { if (el.parentNode) el.remove(); }, 950);
    }

    // --- рендер улучшений ---
    function renderUpgrades() {
      const clickUpg = state.upgrades.click;
      const coinUpg = state.upgrades.coin;

      const clickCost = Math.floor(clickUpg.baseCost * Math.pow(clickUpg.costMultiplier, clickUpg.level));
      const coinCost = Math.floor(coinUpg.baseCost * Math.pow(coinUpg.costMultiplier, coinUpg.level));

      const clickMaxed = clickUpg.level >= clickUpg.maxLevel;
      const coinMaxed = coinUpg.level >= coinUpg.maxLevel;

      upgradesContainer.innerHTML = `
        <div class="upgrade-row">
          <div class="upgrade-info">
            <span class="upgrade-name">⚡ ${clickUpg.name}</span>
            <span class="upgrade-desc">ур. ${clickUpg.level}/${clickUpg.maxLevel} · +${clickUpg.bonusPerLevel} сила</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="upgrade-price">🪙 ${clickMaxed ? 'MAX' : clickCost}</span>
            <button class="upgrade-btn" id="upgradeClickBtn" ${clickMaxed ? 'disabled' : ''}>
              ${clickMaxed ? 'макс' : 'купить'}
            </button>
          </div>
        </div>
        <div class="upgrade-row">
          <div class="upgrade-info">
            <span class="upgrade-name">🪙 ${coinUpg.name}</span>
            <span class="upgrade-desc">ур. ${coinUpg.level}/${coinUpg.maxLevel} · +${coinUpg.bonusPerLevel} монет</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="upgrade-price">🪙 ${coinMaxed ? 'MAX' : coinCost}</span>
            <button class="upgrade-btn" id="upgradeCoinBtn" ${coinMaxed ? 'disabled' : ''}>
              ${coinMaxed ? 'макс' : 'купить'}
            </button>
          </div>
        </div>
      `;

      document.getElementById('upgradeClickBtn')?.addEventListener('click', () => buyUpgrade('click'));
      document.getElementById('upgradeCoinBtn')?.addEventListener('click', () => buyUpgrade('coin'));
    }

    // --- покупка улучшения ---
    function buyUpgrade(type) {
      const upg = state.upgrades[type];
      if (upg.level >= upg.maxLevel) return;
      const cost = Math.floor(upg.baseCost * Math.pow(upg.costMultiplier, upg.level));
      if (state.coins < cost) return;

      state.coins -= cost;
      upg.level += 1;
      updateUI();
      renderUpgrades();
      renderNFTs();
    }

    // --- рендер NFT ---
    function renderNFTs() {
      nftGrid.innerHTML = '';
      state.nfts.forEach(nft => {
        const card = document.createElement('div');
        card.className = `nft-card ${nft.owned ? 'owned' : ''}`;
        card.innerHTML = `
          <div class="nft-icon">${nft.icon}</div>
          <div class="nft-name">${nft.name}</div>
          <div class="nft-bonus">+${nft.bonus} сила</div>
          ${nft.owned
            ? `<div class="owned-badge">✅ владение</div>`
            : `<div class="nft-price">🪙 ${nft.cost}</div>
               <button class="nft-btn" data-id="${nft.id}">купить</button>`
          }
        `;
        nftGrid.appendChild(card);
      });

      document.querySelectorAll('.nft-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          buyNFT(id);
        });
      });
    }

    // --- покупка NFT ---
    function buyNFT(id) {
      const nft = state.nfts.find(n => n.id === id);
      if (!nft || nft.owned) return;
      if (state.coins < nft.cost) return;

      state.coins -= nft.cost;
      nft.owned = true;
      updateUI();
      renderNFTs();
      renderUpgrades();
      const rect = tapArea.getBoundingClientRect();
      spawnFloat(rect.left + rect.width/2, rect.top + rect.height/2, `NFT получен! +${nft.bonus}`);
    }

    // --- инициализация ---
    function init() {
      updateUI();
      renderUpgrades();
      renderNFTs();

      tapArea.addEventListener('click', handleTap);
      tapArea.addEventListener('touchstart', handleTap, { passive: false });

      tapArea.setAttribute('role', 'button');
      tapArea.setAttribute('aria-label', 'кликни для заработка');
    }

    init();

  })();
</script>

</body>
</html>
